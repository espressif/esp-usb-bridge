stages:
  - pre-check
  - build
  - target-test

# Global variables
variables:
  EUB_APP_NAME: "bridge"


# WORKFLOW RULES (global rules for when a pipeline should be triggered or not)
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"' # Run pipeline for merge request events.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never # Do not run pipeline on push if there are open merge requests for the branch.
    - if: '$CI_COMMIT_BRANCH' # Run pipeline for any push to the default branch.

##############
#  PRE CHECK #
##############

# Shared-CI-DangerJS (CI from external Gitlab repository)
include:
  - project: espressif/shared-ci-dangerjs
    ref: master
    file: danger.yaml
run-danger-mr-linter:
  stage: pre-check
  tags:
    - dangerjs
  variables:
    ENABLE_CHECK_UPDATED_CHANGELOG: 'false'

pre_commit:
  stage: pre-check
  tags:
    - build
  image: python:3.11-bookworm
  before_script:
    - apt-get update
    - apt-get install -y git
  script:
    - pip install pre-commit
    - echo "Merge request is from ${CI_COMMIT_REF_NAME} into ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
    - git fetch origin ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME} ${CI_COMMIT_REF_NAME}
    - export from_sha=$(git merge-base HEAD origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME})
    - echo "Checking changes from ${from_sha} to ${CI_COMMIT_SHA}:"
    - git log --oneline ${from_sha}..${CI_COMMIT_SHA}
    - echo "Modified files:"
    - git diff-tree --no-commit-id --name-only -r ${from_sha} ${CI_COMMIT_SHA}
    - echo "Running pre-commit:"
    - pre-commit run --from ${from_sha} --to ${CI_COMMIT_SHA}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

################
#  BUILD TESTS #
################

.build_template:
  tags:
    - build
  script:
    - pip install -U idf-build-apps --prefer-binary
    - |
      PEDANTIC_FLAGS="-DIDF_CI_BUILD -Werror -Werror=deprecated-declarations -Werror=unused-variable -Werror=unused-but-set-variable -Werror=unused-function"
      export PEDANTIC_CFLAGS="${PEDANTIC_FLAGS} -Wstrict-prototypes"
      export PEDANTIC_CXXFLAGS="${PEDANTIC_FLAGS}"
      # sdkconfig.defaults.esp_prog2 applies to esp32s3 only. --sdkconfig-defaults
      # is shared by every app in one invocation, so the chips are built separately.
      status=0
      python -m idf_build_apps build -v -p . --target esp32s2 --keep-going \
        --config-rules "sdkconfig.*.defaults=" \
        --build-dir "build/@t_@w" || status=1
      python -m idf_build_apps build -v -p . --target esp32s3 --keep-going \
        --sdkconfig-defaults "sdkconfig.defaults;sdkconfig.defaults.esp_prog2" \
        --config-rules "sdkconfig.*.defaults=" \
        --build-dir "build/@t_@w" || status=1
      for BUILD_DIR in build/*_*; do
        [ -f "${BUILD_DIR}/flash_args" ] || continue
        CHIP_NAME="${BUILD_DIR##*/}"
        CHIP_NAME="${CHIP_NAME%%_*}"
        echo "===== Merging ${BUILD_DIR} ====="
        if ! (
          cd "${BUILD_DIR}"
          esptool.py --chip "${CHIP_NAME}" merge_bin -o "${EUB_APP_NAME}_merged.bin" @flash_args
        ); then
          echo "FAILED: ${BUILD_DIR} merge_bin"
          status=1
        fi
      done
      exit "${status}"
  artifacts:
    # Upload partial results so target tests can still flash a combination that built.
    when: always
    paths:
      - build/*/flasher_args.json
      - build/*/${EUB_APP_NAME}.elf
      - build/*/${EUB_APP_NAME}.bin
      - build/*/bootloader/bootloader.bin
      - build/*/bootloader/bootloader.elf
      - build/*/partition_table/partition-table.bin
      - build/*/${EUB_APP_NAME}_merged.bin
    expire_in: 2 weeks
  needs:
    - job: pre_commit
      optional: true

build_matrix:
  extends: .build_template
  stage: build
  parallel:
    matrix:
      - IDF_VERSION: [
          "release-v5.0",
          "release-v5.1",
          "release-v5.2",
          "release-v5.3",
          "release-v5.4",
          "release-v5.5",
          "release-v6.0",
          "latest"
        ]
  image: espressif/idf:${IDF_VERSION}

#################
#  TARGET TEST  #
#################

.target_test_template:
  stage: target-test
  # The latest image builds every combination. Run these tests when one of the
  # others failed, as long as the firmware this job flashes was uploaded.
  when: always
  variables:
    EUB_MERGED_BIN: build/esp32s3_jtag/bridge_merged.bin
  before_script:
    - cp "${EUB_MERGED_BIN}" build/bridge_merged.bin
    - pip install -r test/requirements.txt
  script:
    - pytest "${EUB_TEST_FILE}" -vv -s --port "${EUB_PORT}" --junitxml="${EUB_JUNIT_XML}"
  artifacts:
    when: always
    reports:
      junit: $EUB_JUNIT_XML
    paths:
      - test/report_*.xml
    expire_in: 1 week

.target_test_openocd:
  extends: .target_test_template
  # ESP-IDF image provides openocd-esp32 plus interface/target scripts.
  image: espressif/idf:latest
  before_script:
    - . "${IDF_PATH}/export.sh"
    - cp "${EUB_MERGED_BIN}" build/bridge_merged.bin
    - pip install -r test/requirements.txt

target_test_uart:
  extends: .target_test_template
  image: python:3.13-slim
  tags:
    - eub_uart
  script:
    - pytest "${EUB_TEST_FILE}" -vv -s --port "${EUB_PORT}" --uf2-device "${EUB_UF2_DEVICE}" --junitxml="${EUB_JUNIT_XML}"
  needs:
    - job: build_matrix
      parallel:
        matrix:
          - IDF_VERSION: latest
  variables:
    EUB_PORT: "/dev/serial_ports/prog2_uart"
    EUB_UF2_DEVICE: "/dev/serial_ports/prog2_uart_msc"
    EUB_TEST_FILE: "test/test_target_uart.py"
    EUB_JUNIT_XML: "test/report_uart.xml"

target_test_jtag:
  extends: .target_test_openocd
  tags:
    - eub_jtag
  needs:
    - job: build_matrix
      parallel:
        matrix:
          - IDF_VERSION: latest
  variables:
    EUB_PORT: "/dev/serial_ports/prog2_jtag"
    EUB_TEST_FILE: "test/test_target_jtag.py"
    EUB_JUNIT_XML: "test/report_jtag.xml"

target_test_swd:
  extends: .target_test_openocd
  tags:
    - eub_swd
  needs:
    - job: build_matrix
      parallel:
        matrix:
          - IDF_VERSION: latest
  variables:
    EUB_MERGED_BIN: build/esp32s3_swd/bridge_merged.bin
    EUB_PORT: "/dev/serial_ports/prog2_swd"
    EUB_TEST_FILE: "test/test_target_swd.py"
    EUB_JUNIT_XML: "test/report_swd.xml"
